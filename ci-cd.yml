# CI/CD for Laurie's portfolio
#
#   CI  — on every push and pull request: validate HTML, lint CSS and JS,
#         build the site, and check that no internal links are broken.
#   CD  — only if CI passes:
#           push to main   -> deploy to the live site on Netlify
#           pull request   -> deploy a preview and comment the link on the PR
#
# Deploying needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  and  NETLIFY_SITE_ID
# Until they are added, CI still runs and the deploy steps are skipped.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Check site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install tools
        run: npm ci

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: Check links
        run: node scripts/check-links.mjs

  deploy:
    name: Deploy to Netlify
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check Netlify secrets
        id: secrets
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Netlify secrets are not set, so deployment was skipped. See the README."
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: node scripts/build.mjs

      - name: Deploy live site
        if: steps.secrets.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          npx --yes netlify-cli@27 deploy --dir=dist --prod --no-build \
            --message "Deploy ${GITHUB_SHA::7} from GitHub Actions"
          echo "### Deployed to the live site" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview
        id: preview
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes netlify-cli@27 deploy --dir=dist --no-build \
            --alias "pr-${PR_NUMBER}" --message "Preview for PR #${PR_NUMBER}" --json > deploy.json
          url=$(jq -r '.deploy_url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on the pull request
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- netlify-preview -->";
            const body = `${marker}\n**Preview is ready:** ${process.env.PREVIEW_URL}\n\nBuilt from ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
